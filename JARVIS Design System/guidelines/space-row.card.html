<!-- @dsCard group="Spacing" viewport="700x170" name="Row rhythm" subtitle="Rows bleed 6px past the panel padding so the hover wash reaches the edge." -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px 20px;height:170px;display:flex;align-items:center}.panel{width:330px;background:var(--surface);border:1px solid var(--hairline);border-top-color:var(--hairline-up);border-radius:var(--r);padding:16px}.row{display:flex;align-items:center;gap:9px;width:100%;padding:5px 6px;margin:0 -6px;border:0;border-radius:var(--r);background:transparent;color:var(--ink-2);font:inherit;font-size:11.5px;text-align:left}.row.on{background:var(--wash);color:var(--ink)}.d{width:9px;height:9px;border-radius:50%;flex:none}.lbl{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tail{color:var(--ink-3);font-size:10px}.note{margin-left:26px;font-size:10px;color:var(--ink-3);line-height:1.6;max-width:250px}</style></head><body>
<div class="panel">
<div class="row"><span class="d" style="background:var(--t-project)"></span><span class="lbl">Storefront rebuild</span><span class="tail">12</span></div>
<div class="row on"><span class="d" style="background:var(--t-client)"></span><span class="lbl">Harrow &amp; Vane</span><span class="tail">9</span></div>
<div class="row"><span class="d" style="background:var(--t-invoice)"></span><span class="lbl">Fatura 4471</span><span class="tail">4</span></div>
</div>
<div class="note">padding 5px 6px · margin 0 −6px<br>gap 9px · dot 9px · tail 10px<br>hover: background #fff/.045, ink → ink-1<br>110ms, colour only. Rows never move.</div>
</body></html>

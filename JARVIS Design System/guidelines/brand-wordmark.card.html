<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:0;height:200px;display:flex;align-items:center;gap:40px;padding-left:36px}.mark{font-family:var(--font-mono);font-size:40px;letter-spacing:.16em;color:var(--ink)}.sm{font-family:var(--font-mono);font-size:13px;letter-spacing:.24em;color:var(--ink-2)}.tiny{font-family:var(--font-mono);font-size:10px;letter-spacing:.17em;color:var(--ink-3)}.say{font-size:10px;color:var(--ink-3);line-height:1.7;max-width:230px}</style></head><body>
<div style="display:flex;flex-direction:column;gap:16px"><span class="mark">JARVIS</span><span class="sm">JARVIS</span><span class="tiny">JARVIS</span></div>
<div class="say">No mark, no icon, no wordmark file exists in the codebase — the browser tab even ships a blank favicon (<span style="color:var(--ink-2)">href="data:,"</span>). Set the name in the mono face, uppercase, tracked wide. Do not draw a mark.</div>
</body></html>

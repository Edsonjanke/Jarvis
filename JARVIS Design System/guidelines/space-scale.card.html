<div class="c"><span class="b" style="width:4px"></span><span class="k">4</span></div>
<div class="c"><span class="b" style="width:6px"></span><span class="k">6</span></div>
<div class="c"><span class="b" style="width:8px"></span><span class="k">8</span></div>
<div class="c"><span class="b" style="width:10px"></span><span class="k">10</span></div>
<div class="c"><span class="b" style="width:12px"></span><span class="k">12</span></div>
<div class="c"><span class="b" style="width:14px"></span><span class="k">14</span></div>
<div class="c"><span class="b" style="width:16px"></span><span class="k">16 · pad</span></div>

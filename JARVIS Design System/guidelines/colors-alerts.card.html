<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:0;height:170px;display:flex;flex-direction:column;justify-content:center}.a{display:flex;align-items:baseline;gap:10px;padding:9px 18px;font-size:11.5px;border-bottom:1px solid var(--hairline);background:var(--alert-warn-bg);color:var(--alert-warn-fg)}.a b{font-weight:600;letter-spacing:var(--track-label);text-transform:uppercase;font-size:10px;opacity:.75;flex:none}.crit{background:var(--alert-crit-bg);color:var(--alert-crit-fg)}.info{background:var(--alert-info-bg);color:var(--alert-info-fg)}.say{padding:14px 18px 0;font-size:10px;color:var(--ink-3)}</style></head><body>
<div class="a crit"><b>Offline</b><span>The JARVIS server is not answering.</span></div>
<div class="a"><b>Skipped</b><span>3 files were not indexed. unreadable PDF; over the size limit</span></div>
<div class="a info"><b>Stage 5</b><span>Voice, memory and vault edits are wired.</span></div>
<div class="say">Silence means working. No success toast exists in this product.</div>
</body></html>

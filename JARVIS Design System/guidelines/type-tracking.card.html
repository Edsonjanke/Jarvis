<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:18px 20px;height:170px;display:flex;flex-direction:column;justify-content:center;gap:13px}.r{display:flex;align-items:center;gap:16px}.k{width:110px;flex:none;font-size:9.5px;color:var(--ink-3)}.eyebrow{display:inline-flex;align-items:center;gap:7px;font-size:10px;letter-spacing:.17em;text-transform:uppercase;color:var(--ink-3)}.eyebrow::before{content:"";width:6px;height:1px;background:currentColor}.mode{font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-3)}.state{font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--accent)}.name{font-size:11.5px;letter-spacing:.04em;color:var(--ink-2);text-transform:capitalize}</style></head><body>
<div class="r"><span class="k">.17em eyebrow</span><span class="eyebrow">Shortest path</span></div>
<div class="r"><span class="k">.18em mode</span><span class="mode">ask</span></div>
<div class="r"><span class="k">.24em state</span><span class="state">listening</span></div>
<div class="r"><span class="k">.10em control</span><span style="font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2)">Reindexar</span></div>
<div class="r"><span class="k">.04em name</span><span class="name">reference</span></div>
</body></html>

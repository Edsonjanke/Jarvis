<!-- @dsCard group="Brand" viewport="700x190" name="The phosphor field" subtitle="Flat void, a 46px grid, a scanline and one centre bloom. Set data-hud-field and nothing else." -->
<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;height:190px;overflow:hidden}.f{position:absolute;inset:0}.tag{position:absolute;z-index:2;font-family:var(--font-mono);font-size:var(--size-tick);letter-spacing:.1em;text-transform:uppercase;color:var(--text-label)}</style></head>
<body><div class="f" data-hud-field>
<span class="tag" style="left:18px;top:16px">void #050908</span>
<span class="tag" style="left:18px;bottom:16px">grid 46px · --hud-grid .035</span>
<span class="tag" style="right:18px;top:16px">scanline 3px · --hud-scan .022</span>
<span class="tag" style="right:18px;bottom:16px">bloom: radial, 5.5% no centro</span>
<span style="position:absolute;z-index:2;left:50%;top:50%;transform:translate(-50%,-50%);font-family:var(--font-mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);text-shadow:var(--hud-glow-soft)">sistemas operacionais</span>
</div></body></html>

<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:18px 20px;height:150px;display:flex;gap:10px;align-items:stretch}.sw{flex:1;display:flex;flex-direction:column;justify-content:flex-end;padding:8px;border:1px solid var(--hairline);border-top-color:var(--hairline-up);border-radius:var(--r)}.n{font-size:10px;letter-spacing:var(--track-label);text-transform:uppercase;color:var(--ink-2)}.v{font-size:9.5px;color:var(--ink-3);margin-top:3px}</style></head><body>
<div class="sw" style="background:var(--void)"><span class="n">void</span><span class="v">#050908</span></div>
<div class="sw" style="background:var(--surface)"><span class="n">surface</span><span class="v">rgba(8,17,13,.74)</span></div>
<div class="sw" style="background:var(--surface-2)"><span class="n">surface-2</span><span class="v">rgba(11,23,18,.86)</span></div>
<div class="sw" style="background:var(--wash)"><span class="n">wash</span><span class="v">#fff / .045</span></div>
<div class="sw" style="background:var(--plate)"><span class="n">plate</span><span class="v">rgba(7,8,9,.72)</span></div>
</body></html>

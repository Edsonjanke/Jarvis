<!-- @dsCard group="Colors" viewport="700x160" name="Accent — state only" subtitle="One accent. It marks focus, traced path and live reactor. Never a category." -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:18px 20px;height:160px;display:flex;flex-direction:column;justify-content:center;gap:14px}.row{display:flex;gap:10px;align-items:stretch}.sw{flex:1;height:44px;border-radius:var(--r);display:flex;flex-direction:column;justify-content:flex-end;padding:6px 8px}.n{font-size:10px;letter-spacing:var(--track-label);text-transform:uppercase}.v{font-size:9.5px;opacity:.7}.demo{display:flex;gap:10px;align-items:center}.key{font-size:10.5px;letter-spacing:var(--track-label);text-transform:uppercase;color:var(--accent);background:var(--accent-soft);border:1px solid var(--accent-line);border-radius:var(--r);padding:6px 11px}.off{color:var(--ink-2);background:transparent;border-color:var(--hairline)}.say{font-size:10px;color:var(--ink-3);letter-spacing:.04em}</style></head><body>
<div class="row">
<div class="sw" style="background:var(--accent);color:#04120b"><span class="n">accent</span><span class="v">#3ce88f</span></div>
<div class="sw" style="background:var(--accent-soft);color:var(--accent)"><span class="n">accent-soft</span><span class="v">.14 fill</span></div>
<div class="sw" style="background:transparent;border:1px solid var(--accent-line);color:var(--accent)"><span class="n">accent-line</span><span class="v">.40 border</span></div>
</div>
<div class="demo"><span class="key off">Brief</span><span class="key">Sempre</span><span class="say">off · pressed. The same three tokens do hover, pressed and focus.</span></div>
</body></html>

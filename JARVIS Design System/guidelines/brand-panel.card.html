<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;height:210px;position:relative;overflow:hidden;background:var(--void)}.dot{position:absolute;border-radius:50%}.ln{position:absolute;height:1px;background:rgba(255,255,255,.08)}.panel{position:absolute;top:22px;left:150px;width:300px;bottom:22px;background:var(--surface);backdrop-filter:blur(20px) saturate(.85);-webkit-backdrop-filter:blur(20px) saturate(.85);border:1px solid var(--hairline);border-top-color:var(--hairline-up);border-radius:var(--r);padding:16px}.e{display:inline-flex;align-items:center;gap:7px;font-size:10px;letter-spacing:.17em;text-transform:uppercase;color:var(--ink-3)}.e::before{content:"";width:6px;height:1px;background:currentColor}.b{font-family:var(--font-sans);font-size:13.5px;line-height:1.65;color:var(--ink-2);margin-top:10px}.say{position:absolute;right:20px;top:26px;width:190px;font-size:10px;color:var(--ink-3);line-height:1.7}</style></head><body>

<div class="panel"><span class="e">Inspector</span><div class="b">The graph stays legible under the plate — blurred, desaturated, never hidden.</div></div>
<div class="say">background rgba(12,14,17,.74)<br>backdrop-filter blur(20) saturate(.85)<br>border 1px #fff/.075<br>border-top #fff/.14<br>radius 3px · padding 16px<br><br>No drop shadow anywhere.</div>
</body></html>

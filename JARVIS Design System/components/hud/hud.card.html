<!-- @dsCard group="Components" viewport="700x420" name="HUD (v2)" subtitle="The instrument frame, load bars, ring gauge, tile grid, reactor and live log" -->
<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;height:420px;overflow:hidden}#r{height:420px;padding:16px 18px}</style></head>
<body data-hud-field><div id="r"></div>
<script type="text/babel">
const { HudFrame, Meter, RadialGauge, Tile, Reactor, TerminalLog, Icon } = window.JARVISDesignSystem_ad8200;
const col = { display:"flex", flexDirection:"column", gap:"16px" };
const row = (k,v) => <div key={k} style={{display:"flex",justifyContent:"space-between",gap:"8px",fontSize:"var(--size-tick)",padding:"2px 0"}}><span style={{color:"var(--text-label)",textTransform:"uppercase",letterSpacing:".08em"}}>{k}</span><span style={{color:"var(--text-strong)"}}>{v}</span></div>;
ReactDOM.createRoot(document.getElementById("r")).render(
  <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 200px",gap:"22px",height:"100%",position:"relative",zIndex:1}}>
    <div style={col}>
      <HudFrame label="Status do sistema" right="local" foot>
        <Meter label="CPU" value={17} />
        <Meter label="RAM" value={39} />
        <Meter label="Disco" value={91} tone="warn" />
        <Meter label="Rede" value={52} display="2,4 TB/s" />
      </HudFrame>
      <HudFrame label="Banco de memória">
        <RadialGauge value={62} label="memória" caption={<div>{row("contexto","32,4 GB")}{row("longo prazo","128,7 GB")}</div>} />
      </HudFrame>
    </div>
    <div style={col}>
      <HudFrame label="Ações rápidas">
        <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:"var(--tile-gap)"}}>
          <Tile icon="mic" label="Voz" active />
          <Tile icon="scan-line" label="Reindexar" />
          <Tile icon="file-search" label="Analisar" />
          <Tile icon="brain-circuit" label="Treinar" disabled title="etapa 5 liga isto" />
        </div>
      </HudFrame>
      <HudFrame label="Terminal" foot>
        <TerminalLog height={132} busy lines={[
          {at:"22:37:02",tag:"sys",text:"índice aberto — 44 notas, 61 vínculos"},
          {at:"22:37:41",tag:"info",text:"consulta: quanto está vencido com a Jatinox?"},
          {at:"22:37:44",tag:"ok",text:"resposta pronta · 6 citações · 4,1s"},
          {at:"22:38:10",tag:"err",text:"falta ELEVENLABS_API_KEY — voz desligada"},
        ]} />
      </HudFrame>
    </div>
    <div style={{display:"flex",alignItems:"center",justifyContent:"center"}}><Reactor size={188} state="thinking" level={0.7} /></div>
  </div>
);
</script></body></html>
